spring:
  application:
    name: butterflynomics
  datasource:
    url: jdbc:postgresql://localhost:5432/bfn_db
    username: bfn_user
    password: bfn_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

bfn:
  security:
    jwt:
      # Khoá ký token (HS256), tối thiểu 32 byte. Giá trị mặc định CHỈ để chạy local.
      # Khi triển khai thật phải đặt biến môi trường BFN_JWT_SECRET.
      secret: ${BFN_JWT_SECRET:dev-only-secret-khong-dung-o-production-0123456789}
      expires-in-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health
