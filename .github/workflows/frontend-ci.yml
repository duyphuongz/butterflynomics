name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "src/frontend/**"
      - "butterflynomics-design-system/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "src/frontend/**"
      - "butterflynomics-design-system/**"
  workflow_dispatch:

jobs:
  check-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build