<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><style>body{margin:0;padding:24px;background:var(--surface);color:var(--ink)}.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}.cap{font:400 12px/17px var(--font-sans);color:var(--ink-muted);margin:0 0 8px}</style></head><body class="bn">
<p class="cap">Kiểu nút (cỡ mặc định 28px)</p>
<div class="row"><button class="bn-btn bn-btn--primary">Phân tích</button><button class="bn-btn">Đặt lại</button><button class="bn-btn bn-btn--secondary">Lưu kịch bản</button><button class="bn-btn bn-btn--ghost">Xem bằng chứng</button><button class="bn-btn" disabled>Phân tích</button><button class="bn-btn bn-btn--primary" aria-busy="true">Đang phân tích</button></div>
<p class="cap">Cỡ nhỏ 24px, mặc định 28px, lớn 32px</p>
<div class="row"><button class="bn-btn bn-btn--primary bn-btn--sm">Phân tích</button><button class="bn-btn bn-btn--primary">Phân tích</button><button class="bn-btn bn-btn--primary bn-btn--lg">Phân tích</button><button class="bn-btn bn-btn--icon" aria-label="Đóng">✕</button><button class="bn-btn bn-btn--ghost bn-btn--icon bn-btn--sm" aria-label="Mở rộng">+</button></div>
<p class="cap">Nhóm nút bật/tắt</p>
<div class="row"><div class="bn-btn-group" role="group" aria-label="Chế độ"><button class="bn-btn" aria-pressed="true">Cơ bản</button><button class="bn-btn" aria-pressed="false">Chuyên sâu</button></div><div class="bn-btn-group bn-mono" role="group" aria-label="Cửa sổ ngày"><button class="bn-btn bn-btn--sm" aria-pressed="false">[0,+1]</button><button class="bn-btn bn-btn--sm" aria-pressed="true">[−1,+3]</button><button class="bn-btn bn-btn--sm" aria-pressed="false">[−1,+5]</button></div></div>
<p class="cap">Trên thanh tối</p>
<div class="bn-on-inverse" style="background:var(--surface-inverse);padding:12px 16px;display:inline-block"><button class="bn-btn bn-btn--inverse bn-btn--sm">Dán bài báo</button></div>
